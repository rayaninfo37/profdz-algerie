[build]
command = "npx prisma generate && npm run build"

# Force Netlify CDN to never durably cache the /about page (it embeds a DB-driven YouTube video)
[[headers]]
  for = "/about"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    Vary = "Cookie"

# Also disable durable caching for all dynamic dashboard/admin/api routes
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, max-age=0"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, max-age=0"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, no-cache, max-age=0"
    CDN-Cache-Control = "no-store"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Content-Type = "image/x-icon"

[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Content-Type = "application/manifest+json"
